<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="World Passport: a travel game about cultures around the world for 8th grade Global Studies.">
<title>World Passport</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@500&display=swap">
<style>
/* Layout: a night terminal. Departures-board header → globe hero + boarding-pass grid → glass flight-deck panel per destination → holographic certificate. Deliberately single dark look. */
:root{
  color-scheme:dark;
  --night:#060914; --night-2:#0c1226; --card:#0b1122; --panel:rgba(14,21,44,.78); --panel-2:#111a36;
  --ink:#eef1ff; --muted:#97a3cb; --amber:#ffc23d; --cyan:#53e3ff; --gold:#ffd66b; --navy-ink:#f4e7c0;
  --ok:#4ee39a; --bad:#ff5d73; --line:rgba(147,160,200,.22); --paper:#f4ecda; --paper-ink:#1d2133;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --f-hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:radial-gradient(1200px 600px at 12% -10%, rgba(90,95,255,.24), transparent 60%),
    radial-gradient(900px 520px at 100% 110%, rgba(83,227,255,.15), transparent 60%),
    linear-gradient(rgba(147,160,200,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(147,160,200,.05) 1px, transparent 1px);
  background-size:auto,auto,48px 48px,48px 48px;background-attachment:fixed}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:18px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;text-wrap:balance;margin:0;line-height:1.05;letter-spacing:.02em}
h2,h3{text-transform:uppercase}
.mono{font-family:var(--f-mono)}
.label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

/* split-flap letters */
.flap{display:inline-flex;flex-wrap:wrap;gap:.16em .34em}
.flap .w{display:inline-flex;gap:.06em}
.ch{display:inline-block;min-width:.68em;text-align:center;color:var(--amber);border-radius:.09em;padding:.03em .07em;position:relative;
  background:linear-gradient(#18213f 0 50%, #10173a 50%);box-shadow:0 2px 0 rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.05);
  text-shadow:0 0 14px rgba(255,194,61,.45)}
.ch::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
.ch.spin{color:var(--ink);text-shadow:none}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:26px;
  background:rgba(6,9,20,.72);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:#1a1200;box-shadow:0 0 18px rgba(255,194,61,.5)}
.logo svg{width:22px;height:22px;fill:currentColor;transform:rotate(45deg)}
.bar .who{font-family:var(--f-display);font-weight:800;font-size:1.45rem;text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:3px}
.stat b{font-family:var(--f-mono);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums;color:var(--amber);background:#0a0f1f;
  border:1px solid var(--line);border-radius:6px;padding:2px 9px;text-shadow:0 0 10px rgba(255,194,61,.45)}

/* buttons */
.btn{background:var(--amber);color:#1a1200;border:0;border-radius:999px;padding:12px 26px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;
  letter-spacing:.08em;text-transform:uppercase;transition:box-shadow .2s, transform .15s}
.btn:hover:not([disabled]){box-shadow:0 0 26px rgba(255,194,61,.6);transform:translateY(-1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--cyan);border:1.5px solid rgba(83,227,255,.55)}
.btn.ghost:hover{box-shadow:0 0 20px rgba(83,227,255,.35)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* globe */
.globe-wrap{width:100%;max-width:460px;aspect-ratio:1/1}
.globe{width:100%;height:100%;display:block}

/* cover */
.cover-stage{display:grid;grid-template-columns:1fr;gap:0;align-items:center;justify-items:center;margin-top:1vh}
@media (min-width:820px){.cover-stage{grid-template-columns:1.1fr 1fr;gap:20px}}
@media (max-width:819px){.cover-stage .globe-wrap{max-width:300px;margin-bottom:-50px}}
.cover{width:100%;max-width:440px;position:relative;overflow:hidden;color:var(--navy-ink);text-align:center;display:grid;gap:16px;
  background:linear-gradient(155deg,#1d2c62,#0d1638 58%,#1d1046);border-radius:14px 26px 26px 14px;padding:40px 30px 32px;
  box-shadow:inset 12px 0 0 rgba(0,0,0,.3),0 30px 80px rgba(0,0,0,.65),0 0 0 1px rgba(255,214,107,.28)}
.cover::before{content:"";position:absolute;inset:-60%;pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.10) 47%,rgba(83,227,255,.14) 50%,rgba(255,120,210,.12) 53%,transparent 58%);
  animation:sheen 7s ease-in-out infinite alternate}
@keyframes sheen{from{transform:translateX(-25%)}to{transform:translateX(25%)}}
.cover>*{position:relative}
.cover .crest{width:92px;height:92px;margin:0 auto;color:var(--gold);filter:drop-shadow(0 0 10px rgba(255,214,107,.5))}
.cover h1{font-size:clamp(3rem,12vw,4.2rem);font-weight:900;line-height:.9;text-transform:uppercase;color:transparent;
  background:linear-gradient(100deg,#b8862b,#ffe7a0 25%,#c99a3a 45%,#fff3c8 65%,#b8862b 85%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;animation:foil 6s linear infinite}
@keyframes foil{to{background-position:-200% 0}}
.cover .sub{font-family:var(--f-mono);letter-spacing:.28em;font-size:.72rem;color:var(--gold)}
.cover p{margin:0;font-size:1rem;opacity:.9}
.cover input{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid rgba(255,214,107,.6);background:rgba(0,0,0,.28);
  color:var(--navy-ink);font:inherit;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
.cover input::placeholder{color:var(--navy-ink);opacity:.45}
.cover .fine{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}

/* map hero */
.hero{display:grid;grid-template-columns:1fr;gap:6px;align-items:center;margin-bottom:26px}
@media (min-width:760px){.hero{grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px}}
.hero .globe-wrap{max-width:400px;margin:0 auto}
.intro{display:grid;gap:12px;min-width:0}
.intro h2{font-size:clamp(1.9rem,5.5vw,3rem)}
.intro p{margin:0;color:var(--muted);max-width:56ch}
.intro .label{color:var(--cyan)}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.pin{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-right:7px;vertical-align:-1px}
.pin.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px var(--amber)}
.pin.home{background:var(--cyan);border-color:var(--cyan)}

/* boarding passes */
.visas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.visa{display:grid;grid-template-columns:minmax(0,1fr) 104px;text-align:left;padding:0;border:0;background:none;color:var(--ink);
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.5));transition:transform .2s}
.visa:hover:not(.done){transform:translateY(-4px) rotate(-.5deg)}
.pass-main{background:linear-gradient(160deg,#17234d,#0e1632);border-radius:14px 0 0 14px;padding:14px 16px;display:grid;gap:6px;
  border:1px solid var(--line);border-right:0;border-top:3px solid var(--dc);min-width:0}
.pass-stub{background:linear-gradient(160deg,#1b2856,#101939);border-radius:0 14px 14px 0;border:1px solid var(--line);border-left:2px dashed rgba(147,160,200,.4);
  border-top:3px solid var(--dc);display:grid;grid-template-rows:1fr auto;place-items:center;padding:10px 8px;gap:8px;position:relative}
.pass-stub::before,.pass-stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--night)}
.pass-stub::before{top:-12px}.pass-stub::after{bottom:-11px}
.pass-top{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:.72rem;color:var(--cyan);letter-spacing:.1em}
.visa .region{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.visa h3{font-size:1.85rem;line-height:1;color:var(--ink)}
.visa .teaser{font-size:.9rem;color:var(--muted)}
.pass-meta{display:flex;gap:16px;margin-top:4px;flex-wrap:wrap}
.pass-meta b{display:block;font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.board{color:var(--amber)} .landed{color:var(--ok)}
.slot{width:84px;height:84px;border:1.5px dashed rgba(147,160,200,.45);border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:.6rem;color:var(--muted);letter-spacing:.1em}
.visa.done .slot{border:0}
.visa.done{cursor:default}
.visa.done .pass-main{opacity:.85}
.barcode{width:78px;height:26px;opacity:.65;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px)}
.final-card{margin-top:26px;border-radius:16px;padding:22px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  background:linear-gradient(120deg,rgba(255,194,61,.15),rgba(83,227,255,.10));border:1px solid rgba(255,194,61,.45)}
.final-card h3{color:var(--amber);font-size:2rem}

/* flight-deck panel */
.doc{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,34px);
  display:grid;gap:22px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.doc::before{content:"";position:absolute;left:28px;right:28px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--amber),var(--cyan),transparent)}
.doc-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:16px}
.doc-head h2{font-size:clamp(1.6rem,5vw,2.5rem);margin-top:6px}
.doc-head .label{color:var(--cyan)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--amber);color:#1a1200;border-color:var(--amber);box-shadow:0 0 14px rgba(255,194,61,.5)}
.steps span.past{color:var(--ok);border-color:rgba(78,227,154,.5)}
.phrase{display:flex;gap:8px 18px;align-items:baseline;flex-wrap:wrap;border-radius:14px;padding:16px 18px;
  background:linear-gradient(90deg,rgba(255,194,61,.13),rgba(83,227,255,.06));border:1px solid rgba(255,194,61,.32)}
.phrase .say{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--amber);text-shadow:0 0 20px rgba(255,194,61,.5)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.note{min-width:0;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.note h3{font-size:1.3rem;color:var(--cyan);letter-spacing:.06em;margin-bottom:4px}
.note p{margin:0;max-width:65ch}
.lead{font-size:1.1rem;max-width:65ch;margin:0}

/* questions */
.q{display:grid;gap:14px}
.q .prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(1.55rem,4vw,2.1rem);line-height:1.12;max-width:34ch;letter-spacing:.01em}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:rgba(255,255,255,.035);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;gap:14px;align-items:center;
  color:var(--ink);transition:border-color .15s, box-shadow .15s, transform .15s}
.opt:hover:not([disabled]){border-color:var(--cyan);box-shadow:0 0 20px rgba(83,227,255,.22);transform:translateX(3px)}
.opt .k{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#0a0f1f;color:var(--amber);border:1px solid var(--line);font-family:var(--f-mono);font-weight:600}
.opt.right{border-color:var(--ok);background:rgba(78,227,154,.12);box-shadow:0 0 24px rgba(78,227,154,.25)}
.opt.right .k{background:var(--ok);color:#03210f;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,115,.12)}
.opt.wrong .k{background:var(--bad);color:#2a0508;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{border-left:3px solid var(--amber);padding:12px 16px;background:rgba(255,194,61,.07);border-radius:0 12px 12px 0;max-width:70ch}
.why b{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase}
.why.ok{border-color:var(--ok)} .why.ok b{color:var(--ok)}
.why.no{border-color:var(--bad)} .why.no b{color:var(--bad)}
.counter{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.match{grid-template-columns:1fr}}
.col{display:grid;gap:10px;align-content:start;min-width:0}
.tile{background:rgba(255,255,255,.035);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;color:var(--ink);transition:border-color .15s, box-shadow .15s}
.tile:hover:not([disabled]){border-color:var(--cyan)}
.tile.term{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:.03em;color:var(--amber)}
.tile.sel{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(83,227,255,.3),0 0 22px rgba(83,227,255,.3)}
.tile.locked{border-color:var(--ok);background:rgba(78,227,154,.12);cursor:default}
.tile.term.locked{color:var(--ok)}
.tile.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* postcard (light paper on purpose) */
.postcard{display:grid;grid-template-columns:1fr 160px;gap:18px;background:var(--paper);color:var(--paper-ink);padding:18px;transform:rotate(-.5deg);
  border:10px solid transparent;border-image:repeating-linear-gradient(45deg,#d8394a 0 12px,var(--paper) 12px 20px,#2b5fb8 20px 32px,var(--paper) 32px 40px) 10;
  box-shadow:0 20px 40px rgba(0,0,0,.45)}
@media (max-width:560px){.postcard{grid-template-columns:1fr}}
.postcard textarea{width:100%;min-height:150px;resize:vertical;border:0;color:var(--paper-ink);padding:0 4px;
  background:repeating-linear-gradient(transparent 0 35px, rgba(29,33,51,.2) 35px 36px);line-height:36px;font-family:var(--f-hand);font-size:1.6rem}
.postcard textarea::placeholder{color:rgba(29,33,51,.45)}
.postcard textarea:focus-visible{outline-color:#2b5fb8}
.postcard .side{border-left:1px dashed rgba(29,33,51,.35);padding-left:16px;display:grid;gap:6px;align-content:start}
.postcard .side .label{color:#666b7c}
.postcard .side .mono{font-size:.85rem}
@media (max-width:560px){.postcard .side{border-left:0;padding-left:0}}

/* stamps */
.stamp{filter:drop-shadow(0 0 5px currentColor)}
.stamp.holo{animation:holo 4s linear infinite}
@keyframes holo{from{filter:drop-shadow(0 0 7px currentColor) hue-rotate(0deg)}to{filter:drop-shadow(0 0 7px currentColor) hue-rotate(360deg)}}
.reveal{display:grid;place-items:center;gap:16px;text-align:center;padding:24px 0;background:radial-gradient(circle at 50% 32%, rgba(255,194,61,.16), transparent 55%)}
.reveal svg{width:min(260px,70vw);height:auto}
.reveal h2{font-size:clamp(2rem,6vw,3rem)}
.thump{animation:thump .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes thump{0%{transform:scale(2.4) rotate(-16deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(3,5,12,.75);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.overlay .doc{max-height:85vh;overflow:auto;max-width:860px;width:100%;background:var(--panel-2)}
.boarding{position:fixed;inset:0;z-index:30;display:grid;place-items:center;cursor:pointer;animation:fadein .25s both;
  background:radial-gradient(circle at 50% 40%, #142049, #04060e 70%);
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.boarding.out{opacity:0;transition:opacity .3s}
@keyframes fadein{from{opacity:0}}
.board-card{width:min(600px,100%);display:grid;gap:20px;text-align:center;justify-items:center}
.board-card .label{color:var(--cyan)}
.route{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.route b{display:block;font-family:var(--f-display);font-weight:900;font-size:clamp(2.2rem,9vw,3.6rem);color:var(--amber);line-height:1;text-shadow:0 0 22px rgba(255,194,61,.5)}
.route span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.arc{width:100%;height:auto;overflow:visible}
.arc .trail{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:4 6;opacity:.75}
.arc .plane{fill:var(--ink)}
.board-card h2{font-size:clamp(1.8rem,7vw,3.2rem)}

/* certificate */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.cert{border-radius:22px;padding:clamp(18px,4vw,36px);display:grid;gap:24px;border:2px solid transparent;
  background:linear-gradient(var(--panel-2),var(--panel-2)) padding-box, conic-gradient(from var(--a), #ffd66b,#53e3ff,#ff7ad9,#7ee07a,#ffd66b) border-box;
  animation:spinborder 6s linear infinite;box-shadow:0 30px 90px rgba(0,0,0,.55)}
@keyframes spinborder{to{--a:360deg}}
.cert .doc-head{border-color:var(--line)}
.cert h2{font-size:clamp(2rem,7vw,3.4rem)}
.cert .stat b{font-size:1.1rem}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.cert-grid svg{width:100%;height:auto}
.mrz{font-family:var(--f-mono);font-size:clamp(.6rem,2.2vw,.95rem);letter-spacing:.12em;background:#03050c;color:var(--amber);padding:14px;border-radius:10px;
  overflow-x:auto;white-space:pre;border:1px solid var(--line);text-shadow:0 0 8px rgba(255,194,61,.4)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pc{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:12px 14px;font-family:var(--f-hand);font-size:1.35rem;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.pc .label{color:#666b7c;margin-bottom:4px}
.pc:nth-child(odd){transform:rotate(-.6deg)} .pc:nth-child(even){transform:rotate(.5deg)}
table.tally{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tally td,.tally th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.tally th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400}
.tally td.n{text-align:right;font-family:var(--f-mono);color:var(--amber)}

    <div class="final-card"><div><span class="label">Final checkpoint</span>
      <h3>Border control</h3><div style="color:var(--muted);font-size:.95rem">${FINAL_N} mixed questions from all your travels. Unlocks after all ${DESTS.length} stamps.</div></div>
      <button class="btn" id="fin" ${n<DESTS.length?"disabled":""}>${n<DESTS.length?`${DESTS.length-n} stamps to go`:"Begin exam"}</button></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost small" id="reset">Not your passport? Start over</button></div>`;
  $app.querySelectorAll(".visa:not(.done)").forEach(b=>b.onclick=()=>startDest(b.dataset.id));
  const f=document.getElementById("fin"); if(n>=DESTS.length) f.onclick=startFinal;
  const rs=document.getElementById("reset"); let armed=false;
  rs.onclick=()=>{ if(!armed){armed=true; rs.textContent="Tap again to erase all stamps"; return;} S=freshState(); save(); render(); };
}

function startDest(id){
  const d=dest(id);
  S.cur=id; S.step=0; S.view="dest";
  S.run={readStart:Date.now(), peeked:false, score:0, qi:0, qAns:null,
    qList:shuffle(d.quiz.map((q,i)=>i)),
    mTerms:shuffle(d.match.map(p=>p[0])), mDefs:shuffle(d.match.map(p=>p[1])), mLocked:[], mSel:null, mPts:0, mMiss:0,
    cOrder:shuffle(d.scenario.o.map(x=>({t:x[0],ok:x[1],fb:x[2]}))), cAns:null, postcard:""};
  S.run.qOrder=S.run.qList.map(k=>{const q=d.quiz[k]; return shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));});
  save(); boarding(d,()=>{render(); window.scrollTo(0,0);});
}

}

function notesHTML(d){

function peekBtn(){return `<button class="btn ghost" id="peek">${S.run.peeked?"Reopen field notes":"Peek at field notes (half points)"}</button>`;}

function viewDest(){
  const d=dest(S.cur), st=STEPS[S.step], R=S.run;

    body = notesHTML(d)+`<div class="row"><button class="btn" id="next" disabled>Read the notes…</button>

      <div class="col">${R.mDefs.map(m=>{const lk=R.mLocked.some(t=>d.match.find(p=>p[0]===t)[1]===m);

  }

    body = `<div class="q"><div class="label">Customs officer’s question · worth ${R.peeked?PTS.customs/2:PTS.customs} pts</div>

function addPts(n){S.run.score+=n;}

function wireDest(d, st){
  const R=S.run, next=document.getElementById("next"), peek=document.getElementById("peek");
  if(peek) peek.onclick=()=>openNotes(d);
  if(st==="notes"){
    const rc=document.getElementById("rc");
    const tick=()=>{const left=READ_SECONDS-Math.floor((Date.now()-R.readStart)/1000);
      if(!document.body.contains(next)) return;
      if(left<=0){next.disabled=false; next.textContent="I’m ready for customs"; rc.textContent="";}
      else{rc.textContent=`Read carefully · unlocks in ${left}s`; setTimeout(tick,500);}};
    tick();
    next.onclick=()=>{S.step=1; save(); render(); window.scrollTo(0,0);};
  }
  if(st==="quiz"){
    $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(R.qAns!==null) return; const i=+b.dataset.i; R.qAns=i;
      const ok=R.qOrder[R.qi][i].ok; if(ok) addPts(R.peeked?PTS.mc/2:PTS.mc); answered(ok);
      save(); render();});
    if(next) next.onclick=()=>{R.qAns=null; if(R.qi<d.quiz.length-1){R.qi++;} else {S.step=2;} save(); render();};
  }
  if(st==="match"){
    $app.querySelectorAll(".tile.term:not(.locked)").forEach(b=>b.onclick=()=>{R.mSel=b.dataset.t; render();});
    $app.querySelectorAll(".tile.def:not(.locked)").forEach(b=>b.onclick=()=>{
      if(!R.mSel){b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),400); return;}
      const pair=d.match.find(p=>p[0]===R.mSel);
      if(pair[1]===b.dataset.m){R.mLocked.push(R.mSel); R.mSel=null; sfx("pair");
        if(R.mLocked.length===d.match.length){R.mPts=Math.max(0,d.match.length*PTS.pair-R.mMiss*PTS.pairMiss); addPts(R.mPts);}
        save(); render();}
      else{R.mMiss++; sfx("wrong"); b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),400);}
    });
    if(next) next.onclick=()=>{S.step=3; save(); render();};
  }
  if(st==="customs"){
    $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(R.cAns!==null) return; const i=+b.dataset.i; R.cAns=i;
      const ok=R.cOrder[i].ok; if(ok) addPts(R.peeked?PTS.customs/2:PTS.customs); answered(ok);
      save(); render();});
    if(next) next.onclick=()=>{S.step=4; save(); render();};
  }
  if(st==="postcard"){
    const pc=document.getElementById("pc"), pcc=document.getElementById("pcc");
    const upd=()=>{R.postcard=pc.value; const n=pc.value.trim().length; next.disabled=n<20; pcc.textContent=n<20?`${20-n} more characters`:""; save();};
    pc.oninput=upd; upd();
    next.onclick=()=>{addPts(PTS.postcard); S.done[d.id]={score:R.score, postcard:R.postcard.trim()}; S.step=5; save(); render(); window.scrollTo(0,0);
      setTimeout(()=>{sfx("stamp"); confetti(d.color, gradeOf(R.score)==="gold");},150);};
  }
  if(st==="stamp"){
    next.onclick=()=>{S.view="map"; S.cur=null; S.run=null; save(); render(); window.scrollTo(0,0);};
  }
}

function openNotes(d){
  S.run.peeked=true; save();

  ov.innerHTML=`<div class="doc" role="dialog" aria-label="Field notes" style="--dc:${d.color}"><div class="doc-head"><h2>Field notes: ${esc(d.name)}</h2>
    <button class="btn" id="cl">Close notes</button></div>${notesHTML(d)}</div>`;

/* ---------------- FINAL EXAM ---------------- */
function startFinal(){
  const pool=[];
  DESTS.forEach(d=>d.match.forEach(p=>pool.push({kind:"term",d,term:p[0],mean:p[1]})));
  DESTS.forEach(d=>pool.push({kind:"phrase",d}));
  const where=shuffle(pool).slice(0,FINAL_N-COMPARE.length).map(it=>{
    const others=shuffle(DESTS.filter(x=>x.id!==it.d.id)).slice(0,3);
    const opts=shuffle([it.d,...others]).map(x=>({t:x.name,ok:x.id===it.d.id}));
    const q= it.kind==="term" ? `Where would you most likely encounter “${it.term}” (${it.mean.charAt(0).toLowerCase()+it.mean.slice(1)})?`
      : `Someone greets you with “${it.d.phrase.say}.” Where are you?`;
    return {q,opts,tag:"Identify the culture",why: it.kind==="term"? `${it.term} comes from ${it.d.name}.` : `“${it.d.phrase.say}” is ${it.d.phrase.lang} for “${it.d.phrase.means}.”`};
  });
  const cmp=COMPARE.map(c=>({q:c.q, tag:"Compare cultures", why:c.why, opts:shuffle(c.o.map((t,i)=>({t,ok:i===0})))}));
  S.final={qs:shuffle([...where,...cmp]), i:0, ans:null, score:0, finished:false, startedAt:Date.now()};
  S.view="final"; save(); sfx("whoosh"); render(); window.scrollTo(0,0);
}
function viewFinal(){
  const F=S.final, q=F.qs[F.i], ans=F.ans;
  $app.innerHTML = bar()+`<div class="doc"><div class="doc-head"><div><div class="label">Final checkpoint · All flights</div><h2>${flap("Border control")}</h2></div>
    <div class="mono" style="font-variant-numeric:tabular-nums">${F.i+1} / ${F.qs.length} · ${F.score} pts</div></div>
    <div class="q"><div class="label qtag">${esc(q.tag||"Identify the culture")}</div><div class="prompt">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,i)=>{let c=""; if(ans!==null){if(o.ok)c="right"; else if(i===ans)c="wrong";}
      return `<button class="opt ${c}" data-i="${i}" ${ans!==null?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o.t)}</span></button>`;}).join("")}</div>
    ${ans!==null?`<div class="why ${q.opts[ans].ok?"ok":"no"}"><b>${q.opts[ans].ok?"Correct":"Not quite"}</b><br>${esc(q.why)}</div>
      <div class="row"><button class="btn" id="next">${F.i<F.qs.length-1?"Next question":"Receive my certificate"}</button></div>`:""}</div></div>`;
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(F.ans!==null)return; F.ans=+b.dataset.i; if(q.opts[F.ans].ok)F.score+=PTS.final; answered(q.opts[F.ans].ok); save(); render();});

}

/* ---------------- FUN: sound, toasts, confetti, streaks ---------------- */
const SND={on:true}; try{SND.on=localStorage.getItem("wp-sound")!=="off";}catch(e){}
let AC=null;
function sfx(kind){
  if(!SND.on) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
    const t=AC.currentTime;
    const tone=(f,st,dur,type,vol,f2)=>{const o=AC.createOscillator(), g=AC.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t+st);
      if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+st+dur); g.gain.setValueAtTime(0.0001,t+st); g.gain.exponentialRampToValueAtTime(vol||.12,t+st+.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+st+dur); o.connect(g).connect(AC.destination); o.start(t+st); o.stop(t+st+dur+.05);};
    const noise=(st,dur,vol,f1,f2)=>{const b=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const src=AC.createBufferSource(); src.buffer=b; const fl=AC.createBiquadFilter();
      fl.type="bandpass"; fl.Q.value=1.2; fl.frequency.setValueAtTime(f1,t+st); fl.frequency.exponentialRampToValueAtTime(f2,t+st+dur);
      const g=AC.createGain(); g.gain.setValueAtTime(vol,t+st); g.gain.exponentialRampToValueAtTime(0.0001,t+st+dur); src.connect(fl).connect(g).connect(AC.destination); src.start(t+st);};
    if(kind==="right"){tone(660,0,.14,"triangle"); tone(990,.1,.22,"triangle");}
    if(kind==="wrong"){tone(190,0,.3,"sawtooth",.05,120);}
    if(kind==="pair"){tone(880,0,.12,"sine",.1);}
    if(kind==="streak"){tone(660,0,.1,"triangle"); tone(880,.08,.1,"triangle"); tone(1320,.16,.28,"triangle");}
    if(kind==="stamp"){noise(0,.18,.5,1800,200); tone(90,0,.25,"sine",.35,50);}
    if(kind==="whoosh"){noise(0,1.5,.16,300,3000);}
    if(kind==="win"){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.35,"triangle",.12));}
  }catch(e){}
}
document.addEventListener("click",e=>{const b=e.target.closest("#snd"); if(!b) return;
  SND.on=!SND.on; try{localStorage.setItem("wp-sound",SND.on?"on":"off");}catch(_){}
  b.setAttribute("aria-pressed",SND.on); b.textContent=SND.on?"Sound on":"Sound off"; if(SND.on) sfx("pair");});
function toast(main, small){
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML=`${esc(main)}${small?`<small>${esc(small)}</small>`:""}`; document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
}
function confetti(color, big){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas"); cv.className="confetti"; document.body.appendChild(cv);
  const ctx=cv.getContext("2d"), dpr=Math.min(2,window.devicePixelRatio||1), W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);
  const cols=[color,"#ffc23d","#53e3ff","#ffffff","#ff7ad9"];
  const ps=Array.from({length:big?180:90},()=>({x:W/2,y:H*.36,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,r:Math.random()*3,vr:(Math.random()-.5)*.4,
    w:5+Math.random()*6,h:3+Math.random()*4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(now){const t=now-t0; ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0,1-t/2200); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();});
    if(t<2200) requestAnimationFrame(f); else cv.remove();})(t0);
}
/* ---------------- TICKET MOTIFS: one traditional pattern per culture ---------------- */
const svgTile=(w,h,body)=>`url('data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${body}</svg>`)}')`;
const KORU=(()=>{let d="M18 64 C18 50 22 42 30 36"; const cx=34, cy=26; for(let t=0;t<=4*Math.PI;t+=.25){const r=12-t*.85; d+=` L${(cx+r*Math.cos(t+Math.PI*.75)).toFixed(1)} ${(cy+r*Math.sin(t+Math.PI*.75)).toFixed(1)}`;} return d;})();
const MOTIFS={
  japan:{name:"Seigaiha (ocean waves)", w:40,h:20, svg:c=>{const wv=(x,y)=>`<g transform="translate(${x} ${y})"><circle r="19" fill="#121c44" stroke="${c}" stroke-opacity=".6"/><circle r="14" fill="none" stroke="${c}" stroke-opacity=".45"/><circle r="9" fill="none" stroke="${c}" stroke-opacity=".38"/><circle r="4" fill="none" stroke="${c}" stroke-opacity=".3"/></g>`; return wv(20,0)+wv(0,10)+wv(40,10)+wv(20,20);}},
  india:{name:"Rangoli (floor art)", w:56,h:56, svg:c=>{let b=`<circle cx="28" cy="28" r="22" fill="none" stroke="${c}" stroke-opacity=".35" stroke-dasharray="1.5 4"/>`;
    for(let k=0;k<8;k++) b+=`<ellipse cx="28" cy="16" rx="3.6" ry="9" fill="none" stroke="${c}" stroke-opacity=".55" transform="rotate(${k*45} 28 28)"/>`;
    return b+`<circle cx="28" cy="28" r="3" fill="${c}" fill-opacity=".6"/><circle cx="0" cy="0" r="2" fill="${c}" fill-opacity=".5"/><circle cx="56" cy="56" r="2" fill="${c}" fill-opacity=".5"/><circle cx="56" cy="0" r="2" fill="${c}" fill-opacity=".5"/><circle cx="0" cy="56" r="2" fill="${c}" fill-opacity=".5"/>`;}},
  morocco:{name:"Zellige (star tilework)", w:40,h:40, svg:c=>`<g fill="none" stroke="${c}" stroke-opacity=".55" stroke-width="1.2"><rect x="11" y="11" width="18" height="18"/><rect x="11" y="11" width="18" height="18" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="4"/><path d="M0 0 L6 6 M40 0 L34 6 M0 40 L6 34 M40 40 L34 34"/><rect x="-4" y="-4" width="8" height="8" transform="rotate(45 0 0)"/><rect x="36" y="-4" width="8" height="8" transform="rotate(45 40 0)"/><rect x="-4" y="36" width="8" height="8" transform="rotate(45 0 40)"/><rect x="36" y="36" width="8" height="8" transform="rotate(45 40 40)"/></g>`},
  ghana:{name:"Kente (woven strips)", w:48,h:48, svg:c=>`<rect width="48" height="48" fill="#f2c230" fill-opacity=".16"/><rect width="24" height="24" fill="#1f8a4c" fill-opacity=".4"/><rect x="24" y="24" width="24" height="24" fill="#1f8a4c" fill-opacity=".4"/><g fill="#d8394a" fill-opacity=".5"><rect x="24" y="3" width="24" height="2"/><rect x="24" y="9" width="24" height="2"/><rect x="24" y="15" width="24" height="2"/><rect x="24" y="21" width="24" height="2"/></g><g fill="#0a0a0a" fill-opacity=".45"><rect x="3" y="24" width="2" height="24"/><rect x="9" y="24" width="2" height="24"/><rect x="15" y="24" width="2" height="24"/><rect x="21" y="24" width="2" height="24"/></g><rect x="0" y="11" width="24" height="2" fill="${c}" fill-opacity=".6"/><rect x="35" y="24" width="2" height="24" fill="${c}" fill-opacity=".6"/>`},
  peru:{name:"Andean textile (stepped diamonds)", w:32,h:32, svg:c=>`<path d="M0 24 h5 v-5 h5 v-5 h5 v-5 h2 v5 h5 v5 h5 v5 h5" fill="none" stroke="${c}" stroke-opacity=".6" stroke-width="2"/><path d="M16 22 l4 4 -4 4 -4 -4z" fill="#ffd23d" fill-opacity=".5"/><path d="M0 4 h32" stroke="#ff6ad5" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 4"/>`},
  mexico:{name:"Papel picado (cut-paper flags)", w:120,h:32, rep:"repeat-x", pos:"0 100%", svg:c=>{const fl=(x,col)=>`<path d="M${x+2} 3 h36 v20 q-3 5 -6 0 q-3 5 -6 0 q-3 5 -6 0 q-3 5 -6 0 q-3 5 -6 0 q-3 5 -6 0 z" fill="${col}" fill-opacity=".6"/><circle cx="${x+20}" cy="12" r="4" fill="#0f1734"/><path d="M${x+9} 9 l3 3 -3 3 -3 -3z M${x+31} 9 l3 3 -3 3 -3 -3z" fill="#0f1734"/>`;
    return `<path d="M0 3 H120" stroke="#eef1ff" stroke-opacity=".5"/>`+fl(0,c)+fl(40,"#53e3ff")+fl(80,"#ffd23d");}},
  italy:{name:"Roman arcade (arches)", w:36,h:46, rep:"repeat-x", pos:"0 100%", svg:c=>`<g fill="none" stroke="${c}" stroke-opacity=".55" stroke-width="1.5"><path d="M4 46 V22 A14 14 0 0 1 32 22 V46"/><path d="M9 46 V23 A9 9 0 0 1 27 23 V46" stroke-opacity=".3"/><path d="M0 7 H36 M0 11 H36" stroke-opacity=".4"/></g>`},
  aotearoa:{name:"Koru (unfurling fern)", w:64,h:64, svg:c=>`<path d="${KORU}" fill="none" stroke="${c}" stroke-opacity=".6" stroke-width="2.2" stroke-linecap="round"/><circle cx="34" cy="26" r="1.8" fill="${c}" fill-opacity=".7"/>`},
  southafrica:{name:"Ndebele (geometric painting)", w:60,h:44, svg:c=>`<g stroke="#eef1ff" stroke-opacity=".38" stroke-width="2"><rect x="2" y="4" width="14" height="36" fill="${c}" fill-opacity=".35"/><rect x="20" y="4" width="20" height="16" fill="#ffd23d" fill-opacity=".32"/><rect x="20" y="24" width="20" height="16" fill="#3d7bff" fill-opacity=".35"/><rect x="44" y="4" width="14" height="36" fill="#eef1ff" fill-opacity=".08"/><path d="M44 40 L51 26 L58 40 M44 4 L51 18 L58 4" fill="none"/></g>`}
};
const motif=d=>MOTIFS[d.id];
const AIRLINES={southafrica:"Lucian Airways", peru:"Axel Air", mexico:"Montse Airlines"};
function motifStyle(d){const m=motif(d); return `--dc:${d.color};--motif:${svgTile(m.w,m.h,m.svg(d.color))};--msize:${m.w}px ${m.h}px;--mrep:${m.rep||"repeat"};--mpos:${m.pos||"100% 0"}`;}

let ORDER=null;
const order=()=>ORDER||(ORDER=shuffle(DESTS.map(d=>d.id)));
function ticker(){
  const nx=order().find(id=>!S.done[id]);
  const items=order().map(dest).map(d=>{const i=DESTS.indexOf(d), dn=S.done[d.id], st=dn?"Landed":d.id===nx?"Now boarding":"On time";
    return `<span><b>WP ${101+i}</b> ${esc(d.city.toUpperCase())} <i class="${dn?"ok":d.id===nx?"nb":""}">${st.toUpperCase()}</i></span>`;}).join("");
  return `<div class="ticker" aria-hidden="true"><div class="track">${items}${items}</div></div>`;
}
const STREAK_BONUS=20;
function answered(ok){
  S.asked=(S.asked||0)+1;
  if(ok){S.right=(S.right||0)+1; S.streak=(S.streak||0)+1; S.best=Math.max(S.best||0,S.streak);
    if(S.streak>=3){S.bonus=(S.bonus||0)+STREAK_BONUS; sfx("streak"); toast(`Tailwind streak ×${S.streak}`,`+${STREAK_BONUS} bonus`);} else sfx("right");}
  else {S.streak=0; sfx("wrong");}
}
/* keyboard: 1–4 or A–D to answer, Enter to continue */
document.addEventListener("keydown",e=>{
  if(e.target.closest && e.target.closest("button,input,textarea,select,a")) return;
  if(document.querySelector(".overlay,.boarding")) return;
  const k=e.key.toLowerCase(), idx="1234".indexOf(k)>=0?"1234".indexOf(k):"abcd".indexOf(k);
  if(k.length===1 && idx>=0){const o=[...document.querySelectorAll("#app .opt")][idx]; if(o&&!o.disabled){e.preventDefault(); o.click();}}
  else if(e.key==="Enter"){const n=document.getElementById("next"); if(n&&!n.disabled){e.preventDefault(); n.click();}}
});
function pace(){
  const m=Math.floor((Date.now()-S.started)/60000), n=Object.keys(S.done).length;
  if(n===DESTS.length) return `All ${n} stops done in ${m} min. Border control is open.`;
  return `${m} min in the air · ${n} of ${DESTS.length} stops · aim for about 3½ min per stop`+(m>Math.round(n*3.5)+5?" · pick up the pace!":"");
}

/* ---------------- PRE-FLIGHT BRIEFING ---------------- */
const ELEMENTS=[
  ["Language","How people speak and write, including greetings and everyday sayings."],
  ["Customs","Manners and etiquette: how people greet, eat, visit, and show respect."],
  ["Food","What people eat, how they cook it, and how meals are shared."],
  ["Beliefs","Religion and values: what people believe is true, good, and important."],
  ["Arts","Music, dance, clothing, crafts, stories, and buildings."],
  ["Celebrations","Holidays, festivals, and milestones like birthdays and weddings."]];
const BRIEF_Q=[["The way a family greets its guests",true],["The height of a mountain",false],["The temperature outside today",false],["The number of bones in the human body",false]];
function viewBrief(){
  if(!S.brief) S.brief={opts:shuffle(BRIEF_Q.map(x=>({t:x[0],ok:x[1]}))), ans:null};
  const B=S.brief, ans=B.ans, ok=ans!==null&&B.opts[ans].ok;
  $app.innerHTML = bar()+`<div class="doc"><div class="doc-head"><div><div class="label">Before departure · Gate G0</div><h2>${flap("Pre-flight briefing")}</h2></div></div>
    <p class="lead"><b>Culture</b> is the shared way of life of a group of people: what they believe, how they act, and what they make. At every stop you will explore these six parts of culture.</p>
    <div class="elements">${ELEMENTS.map(e=>`<div class="el"><h3>${e[0]}</h3><p>${e[1]}</p></div>`).join("")}</div>
    <div class="code"><div class="label">Traveler’s code</div><ul>
      <li><b>Be curious and respectful.</b> Ask why people do something before deciding what you think about it.</li>
      <li><b>People are individuals.</b> Not everyone in a country follows every custom in these notes, so avoid stereotypes.</li>
      <li><b>Look for connections.</b> Notice what is similar to your own culture, not only what is different.</li></ul></div>
    <div class="q"><div class="label qtag">Boarding check</div><div class="prompt">Which of these is an example of culture?</div>
      <div class="opts">${B.opts.map((o,i)=>{let c=""; if(ans!==null){if(o.ok)c="right"; else if(i===ans)c="wrong";}
        return `<button class="opt ${c}" data-i="${i}" ${ans!==null?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o.t)}</span></button>`;}).join("")}</div>
      ${ans!==null?`<div class="why ${ok?"ok":"no"}"><b>${ok?"Cleared for boarding":"Not quite"}</b><br>Greeting guests is a custom that a group of people learns and shares, so it is part of culture. Mountains, weather, and bones are facts of nature, not culture.</div>
        <div class="row"><button class="btn" id="next">${ok?"Head to departures":"Try again"}</button></div>`
        :`<div class="counter">Tip: answer with keys 1–4, then press Enter to continue.</div>`}</div></div>`;
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(B.ans!==null)return; B.ans=+b.dataset.i; sfx(B.opts[B.ans].ok?"right":"wrong"); save(); render();});
  const n=document.getElementById("next");
  if(n) n.onclick=()=>{ if(ok){S.view="map"; S.brief=null;} else B.ans=null; save(); render(); window.scrollTo(0,0); };
}

/* ---------------- BORDER CONTROL: compare questions ---------------- */
const COMPARE=[
 {q:"Which two cultures from your trip have a traditional greeting that is not a handshake?", o:["Japan (bowing) and the Māori (the hongi)","Italy and Mexico","Ghana and Peru","Morocco and Italy"], why:"Japanese people bow, and the Māori hongi presses noses and foreheads together. The other places commonly use handshakes."},
 {q:"In which two places is eating with the right hand a tradition?", o:["India and Ghana","Japan and Italy","Mexico and Aotearoa New Zealand","Peru and Japan"], why:"In India, roti is used to scoop food with the right hand. In Ghana, fufu is eaten with the right hand."},
 {q:"Which two celebrations are tied to the sky?", o:["Inti Raymi and Matariki","Diwali and Holi","Carnevale and Día de Muertos","Homowo and Hanami"], why:"Inti Raymi honors the sun at the June solstice, and Matariki begins when a star cluster rises."},
 {q:"Which celebration is mainly about remembering loved ones who have died?", o:["Día de Muertos","Holi","Hanami","Carnevale"], why:"Families build ofrendas with photos, favorite foods, and marigolds to remember those who have died."},
 {q:"Morocco welcomes guests with mint tea. Which custom from another stop is also a way of welcoming visitors?", o:["The pōwhiri at a Māori marae","The passeggiata in Italy","Hanami in Japan","The quinceañera in Mexico"], why:"In a pōwhiri, the hosts welcome visitors onto the marae with speeches and songs."},
 {q:"Respect for elders came up at many stops. Which of these would NOT show respect to an elder?", o:["Calling a Mexican grandmother “tú” like a friend","Bowing lower to an elder in Japan","Touching an elder’s feet in India","Greeting the elders first in Ghana"], why:"In Mexico, “usted” is the respectful form for elders. The other three are all ways of honoring elders."},
 {q:"Which pair are both Indigenous languages still spoken by many people today?", o:["Quechua and te reo Māori","Italian and Spanish","Arabic and French","Hindi and English"], why:"Quechua was the language of the Inca, and te reo Māori is an official language of New Zealand."},
 {q:"Why does a good traveler learn about customs before visiting a new place?", o:["To show respect and avoid offending the people they meet","Because everyone in a country acts exactly the same","To prove their own culture is the best","So they never have to talk to local people"], why:"Learning customs honors your hosts. Remember the traveler’s code: people are individuals, so customs are a guide, not a rule for everyone."},
 {q:"Ubuntu from South Africa and Sankofa from Ghana are both…", o:["African ideas that teach a lesson about how to live","Kinds of food","Musical instruments","National holidays"], why:"Ubuntu teaches “I am because we are,” and Sankofa teaches us to learn from the past."}
];

/* ---------------- CLOCK + BOOT ---------------- */
setInterval(()=>{const c=document.getElementById("clock"); if(c&&S.started) c.textContent=fmt(Date.now()-S.started);},1000);
function sky(){
  const cv=document.createElement("canvas"); cv.id="sky"; cv.setAttribute("aria-hidden","true"); document.body.prepend(cv);
  const ctx=cv.getContext("2d"), reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; let W=0,H=0,last=0,shoot=null;
  const fit=()=>{const dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);};
  fit(); addEventListener("resize",()=>{fit(); if(reduce) draw(0);});
  const stars=Array.from({length:180},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.2,p:Math.random()*6.28,s:.4+Math.random()*1.4}));
  function draw(now){
    ctx.clearRect(0,0,W,H);
    for(const st of stars){const al=.2+.6*(.5+.5*Math.sin(st.p+now/1000*st.s)); ctx.fillStyle=`rgba(220,228,255,${al.toFixed(2)})`; ctx.beginPath(); ctx.arc(st.x*W,st.y*H,st.r,0,7); ctx.fill();}
    if(reduce) return;
    if(!shoot && Math.random()<.005) shoot={x:Math.random()*W*.7,y:Math.random()*H*.4,t:now};
    if(shoot){const k=(now-shoot.t)/900; if(k>1) shoot=null; else {const x=shoot.x+k*280, y=shoot.y+k*120, g=ctx.createLinearGradient(x-100,y-43,x,y);
      g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,`rgba(255,255,255,${(.85*(1-k)).toFixed(2)})`); ctx.strokeStyle=g; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(x-100,y-43); ctx.lineTo(x,y); ctx.stroke();}}
  }
  function loop(now){ if(now-last>33){draw(now); last=now;} requestAnimationFrame(loop); }
  if(reduce) draw(0); else requestAnimationFrame(loop);
}
sky();
window.claude?.hot?.snapshot?.(()=>S);
function start(data){ const x=(data&&data.view)?data:load(); if(x) S=Object.assign(freshState(), x); render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
